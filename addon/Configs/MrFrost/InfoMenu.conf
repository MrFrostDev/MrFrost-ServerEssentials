MrFrost_InfoMenuConfig {
 m_sTitle "Server Info"
 m_sDiscordUrl "https://discord.gg/U9qQR3JJRe"
 m_sDiscordLabel "Discord"
 m_sPauseMenuEntry "Server Info"
 m_AccentColor 0.76052 0.38643 0.07819 1
 m_bOpenOnJoin 1
 m_MenuIconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
 m_sMenuIconName "field-manual"
 m_aCategories {
  MrFrost_InfoMenuCategory "{7FA1C3D2E4B51500}" {
   m_bEnabled 1
   m_sName "Welcome"
   m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
   m_sIconName "field-manual"
   m_sTitle "Welcome"
   m_sText "<color rgba='226,167,79,255'><b>Everything your players keep asking about, one keypress away.</b></color><br/><br/>This is the fallback content that ships with the addon. You are meant to replace it.<br/><br/>There are two ways to do that, and they answer two different questions:<br/><br/><image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='check' scale='1'/>  <b>One server</b> - edit the config inside the addon<br/><image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='check' scale='1'/>  <b>Several servers, one published mod</b> - put a JSON file on each server<br/><br/>The second one is what most people want. See <b>Server Setup</b> in the list on the left.<br/><br/>Open this menu with <b>F11</b> or from the pause menu. The key can be rebound under <b>Settings > Controls > MrFrost</b>."
   m_bExpandedByDefault 0
   m_aEntries {
   }
  }
  MrFrost_InfoMenuCategory "{7FA1C3D2E4B51510}" {
   m_bEnabled 1
   m_sName "Server Setup"
   m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
   m_sIconName "settings"
   m_sTitle "Server Setup"
   m_sText "<color rgba='226,167,79,255'><b>One mod, different content per server.</b></color><br/><br/>Every server can carry its own content without its own build of the addon. Players subscribe once and see whatever the server they joined has to say.<br/><br/>Select an entry on the left."
   m_bExpandedByDefault 1
   m_aEntries {
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B51511}" {
     m_bEnabled 1
     m_sName "Content on the server"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "compass"
     m_sTitle "Content on the server"
     m_sText "Create a folder called <b>MrFrost</b> in your server's profile directory - the folder you pass to the server with <b>-profile</b> - and put <b>infomenu.json</b> in it.<br/><br/><color rgba='226,167,79,255'><b>That is the whole setup.</b></color><br/><br/>When a player joins, the server sends them that file and the menu renders it. Nothing is downloaded, nothing is republished, and the mod stays byte for byte the same one everybody else is running.<br/><br/><image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='check' scale='1'/>  No file on the server? Players see this content instead<br/><image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='check' scale='1'/>  Broken JSON? Same - and the server console says why<br/><image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='check' scale='1'/>  Edited the file? Restart the server, like any other server setting<br/><br/><color rgba='234,203,131,255'>A ready-made example is in the repository under server/MrFrost/ - it is this very content as JSON. Copy the whole folder into your profile directory and write your own text into it.</color>"
    }
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B51512}" {
     m_bEnabled 1
     m_sName "JSON reference"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "field-manual"
     m_sTitle "JSON reference"
     m_sText "The file has a handful of keys at the top and a list of categories below them.<br/><br/><color rgba='226,167,79,255'><b>Top level</b></color><br/><br/><b>title</b> - headline above the list<br/><b>pauseMenuEntry</b> - label of the pause menu entry<br/><b>enabled</b> - false switches the whole menu off<br/><b>discordUrl</b> - invite link; leave empty to hide the button<br/><b>discordLabel</b> - label of that button<br/><b>websiteUrl</b>, <b>websiteLabel</b> - the second footer button<br/><b>customUrl</b>, <b>customLabel</b> - the third, named by you; both are needed<br/><b>accentColor</b> - <b>226,167,79</b> as a string, ordinary sRGB as a colour picker shows it<br/><b>menuIcon</b> - sprite next to the title and on the pause menu entry<br/><b>menuIconImageset</b> - the imageset that icon comes from<br/><b>strings</b> - replace any of the menu's own wording<br/><b>openOnJoin</b> - <b>true</b> opens the info menu once when a player joins<br/><b>categories</b> - the list<br/><br/><color rgba='226,167,79,255'><b>A category</b></color><br/><br/><b>name</b> - what the row on the left says<br/><b>title</b> - headline above the text; falls back to the name<br/><b>text</b> - the body, same formatting as everywhere else<br/><b>icon</b> - sprite in front of the row<br/><b>expanded</b> - <b>true</b> starts the category open<br/><b>enabled</b> - <b>false</b> hides it without deleting it<br/><b>entries</b> - the rows below it, same keys minus expanded and entries<br/><br/><color rgba='234,203,131,255'>Sprite names come from the game's shared icon set. Set iconImageset only if you ship your own artwork.</color>"
    }
   }
  }
  MrFrost_InfoMenuCategory "{7FA1C3D2E4B51507}" {
   m_bEnabled 1
   m_sName "Formatting"
   m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
   m_sIconName "check"
   m_sTitle "Text Formatting"
   m_sText "Everything below works in any text, in the addon config and in a server's JSON alike. Select an entry on the left to see it in isolation."
   m_bExpandedByDefault 0
   m_aEntries {
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B51508}" {
     m_bEnabled 1
     m_sName "Text and colour"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "check"
     m_sTitle "Text and colour"
     m_sText "Plain text needs no markup.<br/><br/><b>Bold uses the b tag.</b><br/><br/>Colour takes red, green, blue and alpha from 0 to 255:<br/><br/><color rgba='226,167,79,255'>This line is Reforger gold.</color><br/><color rgba='67,194,93,255'>This line is green.</color><br/><color rgba='249,67,67,255'>This line is red.</color><br/><br/>A single br tag ends a line. Two of them leave a blank line, which is what separates these paragraphs.<br/><br/><color rgba='234,203,131,255'>The addon config cannot hold a double quote inside a text at all - it ends the string there. The guillemets « » sidestep that, and they read better in prose anyway.</color>"
    }
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B51509}" {
     m_bEnabled 1
     m_sName "Images in text"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "scenarios"
     m_sTitle "Images in text"
     m_sText "Images are placed inline with an image tag that names an imageset and a sprite inside it:<br/><br/><image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='check' scale='1'/>  This line starts with a check mark.<br/><image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='warning' scale='1'/>  This one starts with a warning sign.<br/><image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='cancelCircle' scale='1'/>  And this one is how a list of prohibitions reads.<br/><br/>The scale attribute resizes it: <image set='{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset' name='check' scale='2'/> at scale 2.<br/><br/>Wrapping an icon in a colour tag tints it along with the text, which is how the coloured lists in the sample content are built.<br/><br/>To use your own artwork, put an .edds next to this config, drag it into an imageset in the Workbench and reference that imageset here."
    }
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B5150A}" {
     m_bEnabled 1
     m_sName "Row icons"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "characters"
     m_sTitle "Row icons"
     m_sText "Every category and every entry can carry a small icon in the list on the left.<br/><br/>In the addon config, point <b>m_IconImageset</b> at an imageset and <b>m_sIconName</b> at a sprite inside it. As an alternative, <b>m_Icon</b> takes a plain .edds texture; the imageset wins when both are filled in.<br/><br/>In a server's JSON it is simply <b>icon</b>, and the shared icon set is assumed.<br/><br/>Rows without an icon close the gap automatically, so a mixed list still lines up.<br/><br/><color rgba='234,203,131,255'>An icon that does not show is almost always a misspelled sprite name. There is no error for it - the row just has no icon.</color>"
    }
   }
  }
  MrFrost_InfoMenuCategory "{7FA1C3D2E4B51501}" {
   m_bEnabled 1
   m_sName "Server Rules"
   m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
   m_sIconName "warning"
   m_sTitle "Server Rules"
   m_sText "Select an entry on the left to read the individual rules.<br/><br/>This text is what players see when they click the category itself, so it works well as a short introduction."
   m_bExpandedByDefault 0
   m_aEntries {
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B51502}" {
     m_bEnabled 1
     m_sName "General Conduct"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "players"
     m_sTitle "General Conduct"
     m_sText "Replace this with your own text."
    }
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B51503}" {
     m_bEnabled 1
     m_sName "Teamkilling"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "cancelCircle"
     m_sTitle "Teamkilling"
     m_sText "Replace this with your own text."
    }
   }
  }
  MrFrost_InfoMenuCategory "{7FA1C3D2E4B51504}" {
   m_bEnabled 1
   m_sName "Getting Started"
   m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
   m_sIconName "compass"
   m_sTitle "Getting Started"
   m_sText "A good place for the things new players ask on their first evening."
   m_bExpandedByDefault 0
   m_aEntries {
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B51505}" {
     m_bEnabled 1
     m_sName "How to Join a Squad"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "characters"
     m_sTitle "How to Join a Squad"
     m_sText "Replace this with your own text."
    }
    MrFrost_InfoMenuEntry "{7FA1C3D2E4B51506}" {
     m_bEnabled 1
     m_sName "Vehicles"
     m_IconImageset "{3262679C50EF4F01}UI/Textures/Icons/icons_wrapperUI.imageset"
     m_sIconName "veh_trunk"
     m_sTitle "Vehicles"
     m_sText "Replace this with your own text."
    }
   }
  }
 }
