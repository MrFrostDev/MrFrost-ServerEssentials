  MrFrost_TextEntry "{7FA1C3D2E4B520AA}" {
   m_sKey "report.description_hint"
   m_sText "Describe it in your own words. The more precise, the better."
   m_aTranslations {
    MrFrost_Translation "{7FA1C3D2E4B520AB}" {
     m_sLanguage "de_de"
     m_sText "Beschreibe es in eigenen Worten. Je genauer, desto besser."
    }
    MrFrost_Translation "{7FA1C3D2E4B520AC}" {
     m_sLanguage "fr_fr"
     m_sText "Décrivez-le avec vos propres mots. Plus c'est précis, mieux c'est."
    }
    MrFrost_Translation "{7FA1C3D2E4B520AD}" {
     m_sLanguage "it_it"
     m_sText "Descrivilo con parole tue. Più sei preciso, meglio è."
    }
    MrFrost_Translation "{7FA1C3D2E4B520AE}" {
     m_sLanguage "es_es"
     m_sText "Descríbelo con tus palabras. Cuanto más preciso, mejor."
    }
    MrFrost_Translation "{7FA1C3D2E4B520AF}" {
     m_sLanguage "cs_cz"
     m_sText "Popiš to vlastními slovy. Čím přesněji, tím lépe."
    }
    MrFrost_Translation "{7FA1C3D2E4B520B0}" {
     m_sLanguage "pl_pl"
     m_sText "Opisz to własnymi słowami. Im dokładniej, tym lepiej."
    }
    MrFrost_Translation "{7FA1C3D2E4B520B1}" {
     m_sLanguage "ru_ru"
     m_sText "Опишите своими словами. Чем точнее, тем лучше."
    }
    MrFrost_Translation "{7FA1C3D2E4B520B2}" {
     m_sLanguage "uk_ua"
     m_sText "Опишіть своїми словами. Чим точніше, тим краще."
    }
    MrFrost_Translation "{7FA1C3D2E4B520B3}" {
     m_sLanguage "pt_br"
     m_sText "Descreva com suas palavras. Quanto mais preciso, melhor."
    }
    MrFrost_Translation "{7FA1C3D2E4B520B4}" {
     m_sLanguage "ja_jp"
     m_sText "ご自身の言葉で説明してください。具体的なほど助かります。"
    }
    MrFrost_Translation "{7FA1C3D2E4B520B5}" {
     m_sLanguage "ko_kr"
     m_sText "직접 겪은 대로 설명해 주세요. 구체적일수록 좋습니다."
    }
    MrFrost_Translation "{7FA1C3D2E4B520B6}" {
     m_sLanguage "zh_cn"
     m_sText "用你自己的话描述。越具体越好。"
    }
